name: "Terraform Pipeline"

on:
  push:
    branches:
      - test    
  pull_request:
    branches:
      - test

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: project_time_machine_git/environment/dev

    env:
      ARM_CLIENT_ID: "17d3e7cc-315a-497d-8057-391ba6ddb25d"
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: "2dd57896-7866-4df4-8c9e-6830338bdf29"
      ARM_TENANT_ID: "59a67c47-bdae-49db-b64f-d0d414647a56"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Only run apply on push events to the test branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/test' && github.event_name == 'push'
        run: terraform apply tfplan

      # Cleanup plan artifact unconditionally (success, failure, or cancellation)
      - name: Clean up Plan Artifact
        if: always()
        run: rm -f tfplan